name: Patent evidence
on:
  push:
    branches: [patent]
  pull_request:
    paths: ['patent/**']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install ruff
      - run: python -m ruff check patent
      - run: python patent/verify_evidence.py
      - run: python -m compileall -q patent
