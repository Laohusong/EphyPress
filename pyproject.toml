[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ephypress"
version = "0.1.0"
description = "Lossless electrophysiology compression with direct SpikeInterface and Kilosort4 readers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "vendor/fse/LICENSE", "LICENSES/*.txt"]
authors = [{name = "Jiatai Song"}]
keywords = ["electrophysiology", "compression", "neuropixels", "spikeinterface", "kilosort"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.26,<3", "zstandard>=0.22,<1"]

[project.optional-dependencies]
spikeinterface = ["spikeinterface>=0.103.1,<0.106", "scipy>=1.11,<2"]
ks4 = ["kilosort>=4.1.7,<4.2"]
all = ["spikeinterface>=0.103.1,<0.106", "scipy>=1.11,<2", "kilosort>=4.1.7,<4.2"]
dev = ["pytest>=8", "build>=1.2", "twine>=6", "ruff>=0.9"]

[project.scripts]
ephypress = "ephypress.cli:main"

[project.urls]
Homepage = "https://github.com/Laohusong/EphyPress"
Documentation = "https://github.com/Laohusong/EphyPress#readme"
Issues = "https://github.com/Laohusong/EphyPress/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ephypress = ["_predictors.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: optional third-party integration", "gpu: requires CUDA GPU and real recording"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["vendor", "src/ephypress/_mapped.py", "src/ephypress/_mapping.py", "src/ephypress/_predictors.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E402"]

[tool.cibuildwheel]
build = "cp310-*"
skip = "*-musllinux_* *-win*"
test-requires = ["pytest>=8"]
test-command = "pytest {project}/tests/test_codec.py {project}/tests/test_cli.py"

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["auto"]
